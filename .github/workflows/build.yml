name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g @capacitor/cli
      - run: npm init -y
      - run: npm install @capacitor/core @capacitor/android
      - run: mkdir www && cp index.html app.js style.css manifest.json sw.js render.js utils.js www/
      - run: npx cap init MoneyManager com.schifer.moneymanager --web-dir www
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
